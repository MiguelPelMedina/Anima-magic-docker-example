
services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: |
        mongosh --quiet -u ${MONGO_USER} -p ${MONGO_PASSWORD} --authenticationDatabase admin --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./api        # ← antes era ./app, ahora ./api
    container_name: magia_anima_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=admin
    ports:
      - "${API_PORT}:3000"
    networks:
      - app_network
      
  webapp:
    build: ./webApp
    container_name: webapp_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge